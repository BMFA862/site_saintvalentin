<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Statistiques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scriptauth.js"></script>
    <script src="scriptadmin.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body text-center p-5">
                        <h1 class="card-title mb-4 text-primary fw-bold">Statistiques de visites</h1>
                        
                        <div class="card bg-primary text-white p-4 rounded">
                            <h2 class="mb-0">
                                <span id="visitCount">0</span>
                                <small class="d-block mt-2 fs-6">connexion(s) comptabilisée(s)</small>
                            </h2>
                        </div>

                        <div class="mt-4">
                            <button id="resetButton" class="btn btn-danger">Réinitialiser le compteur</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const visitElement = document.getElementById("visitCount");
            const resetButton = document.getElementById("resetButton");

            // 1. Lire le fichier JSON distant et afficher le nombre
            async function afficherStatistiques() {
                if (visitElement) {
                    visitElement.textContent = "Chargement...";
                    const nombreVisites = await lireCompteur();
                    visitElement.textContent = nombreVisites;
                }
            }

            // Lancer l'affichage
            afficherStatistiques();

            // 2. Gestion du bouton Reset
            if (resetButton) {
                resetButton.addEventListener("click", async () => {
                    if (confirm("Êtes-vous sûr de vouloir remettre le compteur à zéro ?")) {
                        const nouveauScore = await resetCompteur();
                        if (nouveauScore !== null) {
                            visitElement.textContent = nouveauScore;
                            alert("Compteur réinitialisé avec succès !");
                        } else {
                            alert("Erreur lors de la réinitialisation.");
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
