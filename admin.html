<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Statistiques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scriptauth.js"></script>
    <script src="scriptadmin.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body text-center p-5">
                        <h1 class="card-title mb-4 text-primary fw-bold">Statistiques de visites</h1>
                        
                        <div class="card bg-primary text-white p-4 rounded">
                            <h2 class="mb-0">
                                <span id="visitCount">0</span>
                                <small class="d-block mt-2 fs-6">connexion(s) comptabilisée(s)</small>
                            </h2>
                        </div>

                        <div class="mt-4">
                            <button id="resetButton" class="btn btn-danger">Réinitialiser le compteur</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const visitElement = document.getElementById("visitCount");
            const resetButton = document.getElementById("resetButton");

            // Fonction pour mettre à jour l'affichage du compteur
            function updateVisitCountDisplay() {
                // Récupérer la valeur depuis l'API externe
                fetch(`https://api.counterapi.dev/v1/${window.COUNTER_NAMESPACE}/${window.COUNTER_KEY}`, { cache: 'no-store' })
                    .then(res => res.json())
                    .then(data => {
                        if (visitElement) visitElement.textContent = data.count;
                    })
                    .catch(err => {
                        if (visitElement) visitElement.textContent = "0";
                    });
            }

            // Mettre à jour l'affichage au chargement de la page
            updateVisitCountDisplay();

            // Gérer le clic sur le bouton de réinitialisation
            if (resetButton) {
                resetButton.addEventListener("click", () => {
                    // Afficher une popup de confirmation
                    const isConfirmed = confirm("Êtes-vous sûr de vouloir réinitialiser le compteur de visites ?");

                    if (isConfirmed) {
                        // Cette API ne permet pas le reset direct pour des raisons de sécurité.
                        // On informe l'utilisateur de la méthode manuelle.
                        alert("Pour réinitialiser le compteur avec cette API sécurisée, veuillez changer la valeur de 'COUNTER_KEY' dans le fichier scriptauth.js (ex: 'global-visits-v2').");
                    }
                });
            }
        });
    </script>
</body>
</html>
