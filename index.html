<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint valentin</title>
    <link rel="icon" type="image/x-icon" href="img/coeuricon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="scriptauth.js"></script>
    <script src="script2.js"></script>
</head>
<body>
    <!-- Écran de chargement -->
    <div id="loadingScreen" class="loading-screen">
        <img src="img/coeuricon.ico" alt="Chargement..." class="loading-icon">
    </div>

    <!-- Affichage du score en haut à gauche -->
    <div id="scoreDisplay" class="score-display">Score : 0/70</div>
    
    <!-- Écran de victoire -->
    <div id="victoryScreen" class="victory-screen hidden">
        <div class="victory-content">
            <button id="closeVictory" class="close-button">×</button>
            <video id="victoryImage" autoplay muted playsinline controlsList="nodownload"><source src="" type="video/mp4">Votre navigateur ne supporte pas la vidéo</video>
        </div>
    </div>
    
    <!-- Conteneur principal -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
    <button id="monBouton">
        <img src="img/boutton.png" style="width: 34vh; height: auto;">
    </button>
    </div>
    <div id="credits">
            <p>
                © 2026 no - Réalisé par Benjamin.
            </p>
        </div>
</body>
</html>
